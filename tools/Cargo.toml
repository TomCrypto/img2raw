[package]
name = "img2raw-tools"
version = "0.5.0"
edition = "2018"
license = "MIT"

repository = "https://github.com/TomCrypto/img2raw"
authors = ["Thomas Bénéteau <thomas@bitwise.me>"]
description = "Convert images to raw pixel data"
categories = ["multimedia::images"]

[[bin]]
name = "img2raw"
path = "src/main.rs"

[dependencies.anyhow]
version = "1.0"

[dependencies.bytemuck]
version = "1.24"

[dependencies.byteorder]
version = "1.3"

[dependencies.half]
version = "2.7"

[dependencies.image]
version = "0.25"
features = ["hdr"]

[dependencies.img2raw]
version = "= 0.5.0"
path = ".."

[dependencies.rayon]
version = "1.2"

[dependencies.structopt]
version = "0.3"

[dependencies.texpresso]
version = "2.0"
