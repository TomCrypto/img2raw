[package]
name = "img2raw"
version = "0.5.0"
edition = "2021"
license = "MIT"

repository = "https://github.com/TomCrypto/img2raw"
authors = ["Thomas Bénéteau <thomas@bitwise.me>"]
description = "Type definitions for img2raw headers"
categories = ["multimedia::images", "no-std"]
readme = "README.md"
exclude = ["tools"]

[dependencies.bytemuck]
version = "1.24"
optional = true
features = ["derive"]

[features]
default = ["bytemuck"]
